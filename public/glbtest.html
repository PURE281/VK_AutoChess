<!DOCTYPE html><html><head><meta charset="utf-8"><style>body{margin:0;background:#222}</style></head><body>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.170.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.170.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
const params=new URLSearchParams(location.search);
const file=params.get('m')||'101003.glb';
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(600,600);document.body.appendChild(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x333344);
const camera=new THREE.PerspectiveCamera(35,1,0.01,100);
scene.add(new THREE.HemisphereLight(0xffffff,0x445566,2.2));
const dl=new THREE.DirectionalLight(0xffffff,2.0);dl.position.set(2,4,3);scene.add(dl);
new GLTFLoader().load('/assets/models/'+file,(g)=>{
  g.scene.scale.setScalar(72);
  scene.add(g.scene);
  window.__meshes=[];
  g.scene.traverse(o=>{
    if((o.isMesh||o.isSkinnedMesh)){
      window.__meshes.push({name:o.name,parent:o.parent?.name,mat:o.material?.name,verts:o.geometry?.attributes?.position?.count||0});
    }
  });
  if(params.get('fix')==='po'){
    const v=parseFloat(params.get('v')||'2');
    g.scene.traverse(o=>{
      if((o.isMesh||o.isSkinnedMesh)&&o.material?.name==='face_m'){
        o.material=o.material.clone();
        o.material.polygonOffset=true;
        o.material.polygonOffsetFactor=-v;
        o.material.polygonOffsetUnits=-v*4;
        o.material.needsUpdate=true;
      }
    });
  }
  g.scene.updateMatrixWorld(true);
  let faceMesh=null;
  g.scene.traverse(o=>{if((o.isMesh||o.isSkinnedMesh)&&o.material?.name==='face_m'&&!faceMesh)faceMesh=o});
  const target=faceMesh||g.scene;
  const box=new THREE.Box3().setFromObject(target);
  const c=box.getCenter(new THREE.Vector3());
  const s=box.getSize(new THREE.Vector3());
  const dist=parseFloat(params.get('d')||'2.6');
  camera.position.set(c.x, c.y+s.y*0.05, c.z+Math.max(s.x,s.y,s.z)*dist);
  camera.lookAt(c.x, c.y, c.z);
  let n=0;const loop=()=>{renderer.render(scene,camera);if(++n<40)requestAnimationFrame(loop);window.__done=true};loop();
},undefined,(e)=>{window.__error=String(e&&e.message||e)});
</script></body></html>
